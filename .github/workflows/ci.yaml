name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cloudflare Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.14.0

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke:cloudflare

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish

      - name: Generate changelog
        uses: hideoo/changelogithub-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
